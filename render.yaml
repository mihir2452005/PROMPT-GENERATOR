services:
  - type: web
    name: metaprompt-backend
    env: python
    plan: free
    branch: main
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: gunicorn "backend.app:app" --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: metaprompt-db
  - type: static
    name: metaprompt-frontend
    env: static
    plan: free
    branch: main
    root: frontend
    buildCommand: npm ci && npm run build
    publishPath: dist

databases:
  - name: metaprompt-db
    plan: starter
    engine: POSTGRES
