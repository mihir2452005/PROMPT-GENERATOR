services:
  - type: web
    name: metaprompt-backend
    env: python
    plan: free
    branch: main
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn "app:app" --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: metaprompt-db
  - type: static
    name: metaprompt-frontend
    env: static
    plan: free
    branch: main
    buildCommand: cd frontend && npm ci && npm run build
    publishPath: frontend/dist

databases:
  - name: metaprompt-db
    plan: starter
    engine: POSTGRES
